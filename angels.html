<script language='JavaScript'>

      var inc=2,delay=30;
      var x=0,y=0,dx=inc,dy=inc;
      var screenX,screenY,offsetX,offsetY,imgW,imgH;

      function setLocation(divObj) {  
              if (navigator.appName=="Netscape") {
                      screenX=window.innerWidth;
                      screenY=window.innerHeight;
                      offsetX=pageXOffset;
                      offsetY=pageYOffset;
                      imgW=document.fly.image1.width;
                      imgH=document.fly.image1.height; 
              }
              else {
                      screenX=document.body.clientWidth;
                      screenY=document.body.clientHeight;
                      offsetX=document.body.scrollLeft;
                      offsetY=document.body.scrollTop;
                      imgW=document.image1.width;
                      imgH=document.image1.height;
              }       
                      
              x=x+dx;
              y=y+dy;
              
              curX=screenX+offsetX-imgW-dx;
              curY=screenY+offsetY-imgH-dy;
      
              if (x>curX) { dx=-dx;}
              if (y>curY) { dy=-dy; }
              if (x<offsetX) { dx=-dx;}
              if (y<offsetY) { dy=-dy;}
      
              var obj;                                
              if (navigator.appName=="Netscape" && parseInt(navigator.appVersion.charAt(0))>4)              
                      obj=document.getElementById(divObj).style;                                                                                      
              else if (navigator.appName=="Netscape" && parseInt(navigator.appVersion.charAt(0))<=4)
                      obj=eval("document."+divObj);                                                                                                         
              else                                                                                                                                                                    
                      obj=eval(divObj+".style");                                                                                                            
              obj.left=x;                                                                                                                                                             
              obj.top=y;                                                                                                                                                              
      }
      setInterval("setLocation('div1')",delay);
</script>
